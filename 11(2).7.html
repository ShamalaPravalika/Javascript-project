<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Card Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f0f0f0;
    }

    form {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
    }

    input, textarea, select, button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.5rem;
      font-size: 1rem;
    }

    #cardContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .profile-card {
      animation: fadeIn 0.5s ease-out;
      padding: 1rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 300px;
      position: relative;
    }

    .profile-card.dark-theme {
      background: #333;
      color: white;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      display: block;
      margin: 1rem auto;
    }

    .square { border-radius: 0; }
    .rounded { border-radius: 15px; }
    .circle { border-radius: 50%; }

    .profile-details {
      text-align: center;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 768px) {
      #cardContainer {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <form id="cardForm">
    <input type="text" id="nameInput" placeholder="Enter name" required />
    <textarea id="bioInput" placeholder="Write a short bio"></textarea>
    <input type="file" id="imageInput" accept="image/*" />
    <select id="borderSelect">
      <option value="square">Square</option>
      <option value="rounded">Rounded</option>
      <option value="circle">Circle</option>
    </select>
    <button type="button" id="previewBtn">Preview</button>
    <button type="submit">Generate Card</button>
  </form>

  <div id="cardContainer"></div>

  <script>
    const form = document.getElementById('cardForm');
    const previewBtn = document.getElementById('previewBtn');
    const container = document.getElementById('cardContainer');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      createCard(false);
    });

    previewBtn.addEventListener('click', () => createCard(true));

    function createCard(isPreview) {
      const name = document.getElementById('nameInput').value;
      const bio = document.getElementById('bioInput').value;
      const border = document.getElementById('borderSelect').value;
      const imageInput = document.getElementById('imageInput');
      const file = imageInput.files[0];

      if (!name || !file) {
        alert("Name and image are required.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function() {
        const card = document.createElement('div');
        card.className = profile-card light-theme;

        card.innerHTML = `
          <img src="${reader.result}" class="profile-img ${border}" />
          <div class="profile-details">
            <h3>${name}</h3>
            <p>${bio}</p>
          </div>
          <div class="card-actions">
            <button onclick="toggleTheme(this.parentElement.parentElement)">🌓 Theme</button>
            ${!isPreview ? `
              <button onclick="editCard(this.parentElement.parentElement)">✏ Edit</button>
              <button onclick="deleteCard(this.parentElement.parentElement)">🗑 Delete</button>
            ` : ''}
          </div>
        `;

        if (!isPreview) {
          const cardData = {
            name, bio, image: reader.result, border, theme: "light"
          };
          saveCard(cardData);
        }

        container.appendChild(card);
      };
      reader.readAsDataURL(file);
    }

    function toggleTheme(card) {
      card.classList.toggle("light-theme");
      card.classList.toggle("dark-theme");
      updateStorage();
    }

    function deleteCard(card) {
      card.remove();
      updateStorage();
    }

    function editCard(card) {
      const name = card.querySelector('h3').textContent;
      const bio = card.querySelector('p').textContent;
      const img = card.querySelector('img').src;
      const border = [...card.querySelector('img').classList].find(cls => ['square','rounded','circle'].includes(cls));

      document.getElementById('nameInput').value = name;
      document.getElementById('bioInput').value = bio;
      document.getElementById('borderSelect').value = border;

      // Remove and allow re-adding after editing
      card.remove();
      updateStorage();
    }

    function saveCard(data) {
      const cards = JSON.parse(localStorage.getItem("cards") || "[]");
      cards.push(data);
      localStorage.setItem("cards", JSON.stringify(cards));
    }

    function updateStorage() {
      const cards = [];
      document.querySelectorAll(".profile-card").forEach(card => {
        const name = card.querySelector("h3").textContent;
        const bio = card.querySelector("p").textContent;
        const image = card.querySelector("img").src;
        const border = [...card.querySelector("img").classList].find(cls => ['square','rounded','circle'].includes(cls));
        const theme = card.classList.contains("dark-theme") ? "dark" : "light";

        cards.push({ name, bio, image, border, theme });
      });
      localStorage.setItem("cards", JSON.stringify(cards));
    }

    window.onload = function() {
      const saved = JSON.parse(localStorage.getItem("cards") || "[]");
      saved.forEach(data => {
        const card = document.createElement('div');
        card.className = profile-card ${data.theme}-theme;

        card.innerHTML = `
          <img src="${data.image}" class="profile-img ${data.border}" />
          <div class="profile-details">
            <h3>${data.name}</h3>
            <p>${data.bio}</p>
          </div>
          <div class="card-actions">
            <button onclick="toggleTheme(this.parentElement.parentElement)">🌓 Theme</button>
            <button onclick="editCard(this.parentElement.parentElement)">✏ Edit</button>
            <button onclick="deleteCard(this.parentElement.parentElement)">🗑 Delete</button>
          </div>
        `;

        container.appendChild(card);
      });
    };
  </script>
</body>
</html>
